<!doctype html>
<!--
  Regenerates src/PageAssay/Static/browser-globals.txt and handler-scope.txt: the names a page's code reaches without defining
  them (the window and its prototype chain), and the names an event-handler attribute reaches besides those (its element, a form
  and the document). Run it in a current Chromium and split the printed text at " HANDLER ":

    chrome --headless=new --dump-dom file:///…/tools/browser-names.html
-->
<body><script>
const names = (o) => { const s = new Set(); for (let p = o; p; p = Object.getPrototypeOf(p)) for (const n of Object.getOwnPropertyNames(p)) s.add(n); return s; };
const ok = (n) => /^[A-Za-z_$][\w$]*$/.test(n);
const g = [...names(window)].filter(ok).sort();
const els = [document, document.createElement('form'), document.createElement('input'), document.createElement('button'), document.createElement('select'), document.createElement('textarea'), document.createElement('dialog'), document.createElement('video'), document.createElement('a'), document.createElement('div')];
const h = new Set(); for (const e of els) for (const n of names(e)) if (ok(n) && !g.includes(n)) h.add(n);
document.body.textContent = 'GLOBALS ' + g.join(' ') + ' HANDLER ' + [...h].sort().join(' ');
</script>
